<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conectar Spotify — botdc</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #121212; color: #fff; padding: 24px;
    }
    .card { max-width: 460px; width: 100%; text-align: center; }
    h1 { color: #1db954; font-size: 22px; margin: 0 0 8px; }
    p { color: #b3b3b3; line-height: 1.5; margin: 8px 0; }
    .code {
      user-select: all; word-break: break-all; font-family: ui-monospace, monospace;
      font-size: 14px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px;
      padding: 14px; margin: 16px 0 8px;
    }
    button {
      background: #1db954; color: #000; border: 0; border-radius: 999px;
      padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .erro { color: #ff6b6b; }
    code { background: #1e1e1e; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card" id="app"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const erro = params.get('error');
    const app = document.getElementById('app');

    if (erro) {
      app.innerHTML =
        '<h1>Autorização negada</h1><p class="erro">' + erro + '</p>' +
        '<p>Feche esta aba e tente de novo pelo Discord.</p>';
    } else if (!code) {
      app.innerHTML =
        '<h1>Nada para mostrar</h1>' +
        '<p>Abra esta página pelo link que o bot enviou no Discord.</p>';
    } else {
      app.innerHTML =
        '<h1>Quase lá!</h1>' +
        '<p>Copie este código e cole no Discord com<br><code>/conectar-spotify codigo:</code></p>' +
        '<div class="code" id="code">' + code + '</div>' +
        '<button id="copy">Copiar código</button>' +
        '<p style="margin-top:16px">Depois pode fechar esta aba. O código expira em poucos minutos.</p>';
      document.getElementById('copy').onclick = async () => {
        try {
          await navigator.clipboard.writeText(code);
          document.getElementById('copy').textContent = 'Copiado!';
        } catch {
          // Clipboard bloqueado: o usuario seleciona e copia manualmente.
          const range = document.createRange();
          range.selectNodeContents(document.getElementById('code'));
          getSelection().removeAllRanges();
          getSelection().addRange(range);
        }
      };
    }
  </script>
</body>
</html>
